<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขุมทรัพย์มงคล - สุ่มเลขนำโชค</title>
    <style>
        body {
            background: radial-gradient(circle, #4a0404 0%, #000000 100%);
            color: #ffd700;
            font-family: 'Sarabun', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px #ffd700;
            max-width: 450px;
            width: 90%;
        }
        h1 { font-size: 1.8rem; text-shadow: 2px 2px 5px #ff0000; margin-bottom: 5px; }
        .mantra { font-style: italic; color: #fff; font-size: 0.9rem; margin-bottom: 20px; }

        /* โซนสิ่งศักดิ์สิทธิ์ */
        .deities-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 15px;
            border: 1px dashed #b8860b;
        }
        .deity {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .deity img {
            width: 70px;
            height: 90px;
            object-fit: cover;
            border: 2px solid #ffd700;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
            background-color: #333;
            transition: all 0.3s ease;
        }
        .deity-name {
            font-size: 0.75rem;
            color: #ffd700;
            text-shadow: 1px 1px 2px #000;
        }

        /* เอฟเฟกต์แสงสิริมงคลเมื่อกดปุ่ม */
        @keyframes holyGlow {
            0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); transform: scale(1); border-color: #ffd700; }
            50% { box-shadow: 0 0 40px #ffd700, 0 0 60px #ffffff; transform: scale(1.15); border-color: #ffffff; }
            100% { box-shadow: 0 0 20px #ffd700; transform: scale(1); border-color: #ffd700; }
        }
        .deity-active img {
            animation: holyGlow 1.5s ease-in-out;
            box-shadow: 0 0 20px #ffd700;
        }

        .lucky-row {
            background: linear-gradient(to right, #b8860b, #ffd700, #b8860b);
            color: #000;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            border-radius: 50px;
            letter-spacing: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            display: none;
        }

        .btn-bless {
            background: linear-gradient(#ff0000, #800000);
            color: white;
            border: 2px solid #ffd700;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }
        .btn-bless:hover { transform: scale(1.05); box-shadow: 0 0 20px #ffd700; }

        .instructions {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ขุมทรัพย์มงคล ๖ ทิศ</h1>
    <div class="mantra">"สัพเพ สัตตา สุขิตา โหนตุ"</div>

    <div class="deities-container">
        <div class="deity">
            <img src="1.jpg" alt="พระสีวลี">
            <span class="deity-name">พระสีวลี</span>
        </div>
        <div class="deity">
            <img src="2.jpg" alt="พระพิฆเนศ">
            <span class="deity-name">พระพิฆเนศ</span>
        </div>
        <div class="deity">
            <img src="3.jpg" alt="หลวงพ่อเงิน">
            <span class="deity-name">หลวงพ่อเงิน</span>
        </div>
    </div>

    <div id="results">
        <div class="lucky-row" id="row1">------</div>
        <div class="lucky-row" id="row2">------</div>
        <div class="lucky-row" id="row3">------</div>
        <div class="lucky-row" id="row4">------</div>
        <div class="lucky-row" id="row5">------</div>
        <div class="lucky-row" id="row6">------</div>
    </div>

    <button class="btn-bless" onclick="generateLuck()">ตั้งจิตอธิษฐาน และสุ่มเลข</button>

    <div class="instructions">
        * สำหรับผู้ประพฤติชอบ มีศีล และหมั่นทำสมาธิเท่านั้น *<br>
        พลังงานแห่งความดีจะดึงดูดสิ่งที่เป็นกุศลมาสู่ตัวคุณ
    </div>
</div>

<script>
    // เตรียมไฟล์เสียง
    const holySound = new Audio('4.mp3');

    function generateLuck() {
        // 1. เล่นเสียง
        holySound.currentTime = 0;
        holySound.play().catch(e => console.log("เบราว์เซอร์อาจบล็อกการเล่นเสียงอัตโนมัติ", e));

        // 2. กระตุ้นเอฟเฟกต์แสงสิริมงคลที่รูปภาพ
        const deities = document.querySelectorAll('.deity');
        deities.forEach(deity => {
            deity.classList.remove('deity-active');
            void deity.offsetWidth;
            deity.classList.add('deity-active');
        });

        // 3. เริ่มการสุ่มเลข
        const rows = 6;
        for (let i = 1; i <= rows; i++) {
            let rowElement = document.getElementById('row' + i);
            let luckyNum = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            rowElement.innerText = luckyNum;
            rowElement.style.display = 'block';
            rowElement.style.opacity = 0;
            let opacity = 0;
            let timer = setInterval(function() {
                if (opacity >= 1) {
                    clearInterval(timer);
                }
                rowElement.style.opacity = opacity;
                opacity += 0.1;
            }, 50 * i);
        }
    }
</script>

</body>
</html>
